map $http_user_agent $is_social_crawler {
    default 0;
    ~*facebookexternalhit 1;
    ~*Twitterbot 1;
    ~*Pinterest 1;
    ~*LinkedInBot 1;
    ~*WhatsApp 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*slackbot 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Intercept requests to /blogs/ for social media crawlers
    location /blogs/ {
        error_page 418 = @seo_proxy;
        if ($is_social_crawler) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @seo_proxy {
        # Ensure correct DNS resolution for Cloud Run proxy
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Add the trailing slash or handle the rewrite
        rewrite ^/blogs/(.*)$ /api/seo/blogs/$1 break;
        
        # We use a variable for proxy_pass so nginx doesn't fail on startup if domain is unreachable
        set $backend "https://yiaga-backend-934225016182.africa-south1.run.app";
        proxy_pass $backend;
        
        proxy_ssl_server_name on;
        proxy_set_header Host yiaga-backend-934225016182.africa-south1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
