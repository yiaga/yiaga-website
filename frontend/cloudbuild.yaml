steps:
  # Step 1: Build the Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yiaga-frontend:$COMMIT_SHA', '.']
    dir: 'frontend' # Replace with your actual frontend folder name

  # Step 2: Push the Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yiaga-frontend:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run (Frontend)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yiaga-frontend' # Your frontend service name
      - '--image'
      - 'gcr.io/$PROJECT_ID/yiaga-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1' # Replace with your actual region (e.g., africa-south1)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/yiaga-frontend:$COMMIT_SHA'
